# Airgapp hostapd configuration: reference only. setup.sh writes the real file,
# and netfilterd rewrites it from the settings on every change.
country_code=US
interface=wlan0
driver=nl80211
ssid=Airgapp
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
# wpa_passphrase: chosen at setup, or generated (there is no default)
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Airgapp dnsmasq configuration
# DHCP + DNS for hotspot clients on wlan0

interface=wlan0
bind-interfaces

# DHCP range
dhcp-range=192.168.4.100,192.168.4.250,24h

# NO global default upstream — that would defeat the default-deny posture.
# Per-domain forwarders are written into /etc/dnsmasq.d/netfilter-dns.conf
# by netfilterd as `server=/<allowed-domain>/<upstream>` lines, each with
# an explicit upstream IP. The `address=/#/` catchall in that file relies
# on there being NO global upstream to fall through to — otherwise every
# unmatched query gets resolved and the sinkhole is a no-op.

# Don't read /etc/resolv.conf either — that file points at 1.1.1.1/8.8.8.8
# as well (it's used by the Pi's own processes, not dnsmasq). Without
# this, dnsmasq would pick those up as default forwarders and again
# defeat the default-deny.
no-resolv

# Include the netfilterd-generated allow-list overrides.
conf-dir=/etc/dnsmasq.d/,*.conf

# Logging — write to syslog (which systemd captures in journald)
log-queries

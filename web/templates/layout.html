{{define "layout"}}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} — Airgapp</title>
    <link rel="preload" href="/static/fonts/saira.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/gap.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="Airgapp dashboard"><span class="brand-logo" aria-hidden="true"></span></a>
        <nav class="topnav" aria-label="Primary">
            <a class="navlink{{if eq .page "dashboard"}} active{{end}}" href="/"{{if eq .page "dashboard"}} aria-current="page"{{end}}>Dashboard</a>
            <a class="navlink{{if eq .page "devices"}} active{{end}}" href="/devices"{{if eq .page "devices"}} aria-current="page"{{end}}>Devices</a>
            <a class="navlink{{if eq .page "traffic"}} active{{end}}" href="/traffic"{{if eq .page "traffic"}} aria-current="page"{{end}}>Traffic</a>
            <a class="navlink{{if eq .page "filters"}} active{{end}}" href="/filters"{{if eq .page "filters"}} aria-current="page"{{end}}>Filters</a>
            <a class="navlink{{if eq .page "system"}} active{{end}}" href="/system"{{if eq .page "system"}} aria-current="page"{{end}}>System</a>
        </nav>
    </header>

    {{- /* The dashboard runs edge to edge; every other page keeps the content padding. */}}
    <main class="content{{if eq .page "dashboard"}} content-bleed{{end}}">
        {{template "content" .}}
    </main>

    <div id="toast-container" role="status" aria-live="polite"></div>

    <script src="/static/js/alpine.min.js" defer></script>
    <script src="/static/js/app.js"></script>
    {{template "scripts" .}}
</body>
</html>
{{end}}

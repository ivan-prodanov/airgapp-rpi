<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — airgapp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div class="login-screen" x-data="loginApp()">
        <form class="login-card" @submit.prevent="login()">
            <div class="login-mark">
                <span class="brand-logo" style="width:132px; height:56px;"></span>
            </div>
            <div class="login-sub">
                Sign in to <strong style="color:var(--fg);">netfilterd-01</strong>. The Guardian is
                currently active — sessions are scoped to the operator account.
            </div>
            <div class="field">
                <label class="label">Operator</label>
                <input class="input" type="text" x-model="username" placeholder="admin" required autofocus>
            </div>
            <div class="field">
                <label class="label">Passphrase</label>
                <input class="input" type="password" x-model="password" placeholder="•••••••••••••" required>
                <div class="field-help" x-show="error" style="color:var(--danger);">● <span x-text="error"></span></div>
            </div>
            <button class="btn primary" type="submit" style="width:100%; justify-content:center; padding:12px 16px;" :disabled="loading">
                <span x-show="!loading">Sign in</span>
                <span x-show="loading">Signing in…</span>
            </button>
            <div class="login-foot">
                <span>192.168.4.1:8443</span>
                <span>Self-signed certificate</span>
            </div>
        </form>
    </div>

    <div id="toast-container"></div>

    <script src="/static/js/alpine.min.js" defer></script>
    <script src="/static/js/app.js"></script>
    <script>
    function loginApp() {
        return {
            username: '',
            password: '',
            loading: false,
            error: '',
            async login() {
                this.loading = true;
                this.error = '';
                try {
                    await api.post('/api/login', {
                        username: this.username,
                        password: this.password,
                    });
                    window.location = '/';
                } catch (e) {
                    this.error = 'Invalid credentials';
                } finally {
                    this.loading = false;
                }
            },
        };
    }
    </script>
</body>
</html>

{{define "title"}}Filters{{end}}

{{define "content"}}
<div class="wrap pg-filters" x-data="filtersApp()">
    <p class="eyebrow" data-rise>Allow-lists · for Filtered devices</p>
    <div class="phead" data-rise>
        <h1 class="h1">Filters</h1>
        <button class="btnp" type="button" @click="openNew()" aria-haspopup="dialog"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9"/></svg>New filter</button>
    </div>
    <div class="search" data-rise="1">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>
        <label class="vh" for="fq">Find a domain or filter</label>
        <input id="fq" type="search" placeholder="Find a domain or filter" x-model="query" @input.debounce.250ms="checkQuery()" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <p class="nomatch" x-show="noMatch" x-text="noMatchText" x-cloak></p>
    <div class="flist" data-rise="2">
        <template x-for="g in groups" :key="g.key">
            <div>
                <div class="ghead"><h2 x-text="g.title"></h2><p x-text="g.sub"></p></div>
                <template x-for="(x, i) in g.items" :key="x.f.id">
                    <div class="frow" :class="rowClass(x, i, g.items.length)">
                        <div class="f-id" @click="toggleOpen(x)">
                            <div class="fname"><span class="fname-t" x-text="x.f.name"></span></div>
                            <div class="fsub"><span class="adot"></span><span x-text="summary(x.f)"></span></div>
                        </div>
                        <label class="f-sw"><span class="swl" aria-hidden="true" x-text="x.f.enabled ? 'On' : 'Off'"></span><span class="sw"><input type="checkbox" role="switch" :checked="x.f.enabled" @change="toggleFilter(x.f, $event)" :aria-label="x.f.name + ' filter'"><span class="track"><span class="k"></span></span></span></label>
                        <button class="f-chev" type="button" @click="toggleOpen(x)" :aria-expanded="isOpen(x)" :aria-label="'Details for ' + x.f.name"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5"/></svg></button>
                        <div class="f-fold"><div class="f-fold-in"><div class="f-panel">
                            <template x-if="(x.f.ports || []).length">
                                <div class="fsec">
                                    <h3>Ports</h3>
                                    <ul class="plist">
                                        <template x-for="p in x.f.ports" :key="p.proto + p.port"><li><b x-text="p.proto + ' ' + p.port"></b><span x-text="p.description"></span></li></template>
                                    </ul>
                                </div>
                            </template>
                            <template x-if="(x.f.domains || []).length || !(x.f.ports || []).length">
                                <div class="fsec">
                                    <h3>Domains<span x-show="x.filtered" x-text="x.domains.length + ' of ' + x.f.domains.length + ' match'"></span></h3>
                                    <ul class="dlist">
                                        <template x-for="d in x.domains" :key="d.id">
                                            <li :class="{ fresh: fresh === d.id, hit: ticked[d.id] }">
                                                <div class="dm-t"><b :title="d.domain" x-text="d.domain"></b><span x-show="d.description" x-text="d.description"></span></div>
                                                <span class="dm-hits" :class="{ none: !d.hits }" x-text="d.hits ? fmt(d.hits) + ' hits' : 'no hits'"></span>
                                                <button class="dm-x" type="button" @click="removeDomain(x.f, d)" :aria-label="'Remove ' + d.domain"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
                                            </li>
                                        </template>
                                    </ul>
                                    <p class="dempty" x-show="!(x.f.domains || []).length">No domains yet. Add the first one below.</p>
                                </div>
                            </template>
                            <div class="dadd" role="group" :aria-label="'Add a domain to ' + x.f.name">
                                <input class="finput" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Domain, e.g. cdn.example.com" x-model="draft(x.f).domain" @input="clearStatus(x.f)" @keydown.enter.prevent="addDomain(x.f)" :aria-label="'Domain to add to ' + x.f.name" :aria-invalid="status[x.f.id] && status[x.f.id].err ? 'true' : 'false'">
                                <input class="finput prose" type="text" placeholder="Note (optional)" x-model="draft(x.f).note" @input="clearStatus(x.f)" @keydown.enter.prevent="addDomain(x.f)" aria-label="Note for this domain (optional)">
                                <button class="btnq" type="button" @click="addDomain(x.f)">Add</button>
                            </div>
                            <div class="fstatus" :class="{ err: status[x.f.id] && status[x.f.id].err }" role="status" aria-live="polite" x-text="status[x.f.id] ? status[x.f.id].text : ''"></div>
                            <div class="ffoot">
                                <span class="fnote" x-show="x.f.is_system">Built-in: you can edit its domains, but it can't be deleted.</span>
                                <button class="btn danger" type="button" x-show="!x.f.is_system && confirmDel !== x.f.id" @click="confirmDel = x.f.id">Delete filter</button>
                                <template x-if="confirmDel === x.f.id">
                                    <div class="d-confirm" role="group" :aria-label="'Confirm deleting ' + x.f.name">
                                        <p x-text="'Delete ' + x.f.name + '? Filtered devices lose every domain it carried.'"></p>
                                        <div class="btns"><button class="btn" type="button" @click="confirmDel = null">Cancel</button><button class="btn danger" type="button" @click="deleteFilter(x.f)">Delete filter</button></div>
                                    </div>
                                </template>
                            </div>
                        </div></div></div>
                    </div>
                </template>
            </div>
        </template>
    </div>

    <dialog class="ndlg" x-ref="dlg" @close="newOpen = false" @click="if ($event.target === $refs.dlg) $refs.dlg.close()" aria-labelledby="ndlg-h">
        <div class="ndlg-form">
            <div class="ndlg-head"><h2 id="ndlg-h">New filter</h2><button class="ndlg-x" type="button" @click="$refs.dlg.close()" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>
            <p>A filter is a named list of domains. It starts off: add domains, then turn it on.</p>
            <label class="field"><span class="flabel">Name</span><input class="finput prose" type="text" maxlength="64" placeholder="e.g. Apple Music" x-model="newName" @input="newErr = ''" @keydown.enter.prevent="createFilter()" :aria-invalid="newErr ? 'true' : 'false'"></label>
            <div class="fstatus err" role="status" aria-live="polite" x-text="newErr"></div>
            <div class="btns"><button class="btn" type="button" @click="$refs.dlg.close()">Cancel</button><button class="btnp" type="button" @click="createFilter()">Create filter</button></div>
        </div>
    </dialog>
</div>
{{end}}

{{define "scripts"}}
<script>
// The Gap filters page. A filter has one switch: its domains apply exactly when
// it is on. Turning one on or off, and removing a domain, apply at once and
// offer Undo; deleting a filter asks first.
function filtersApp() {
    const NAME = /^[A-Za-z0-9][A-Za-z0-9 _\-+'\/]{0,63}$/;
    const GROUPS = [
        { key: 'System', title: 'Car system', sub: 'What the Tesla needs to drive, navigate and stay online.' },
        { key: '', title: 'Apps & streaming', sub: 'Turn on what you want to use in the car.' },
    ];
    return {
        filters: [], loaded: false, open: {}, drafts: {}, status: {}, query: '',
        confirmDel: null, fresh: null, freshFilter: null, newOpen: false, newName: '', newErr: '',
        ticked: {}, active: {}, blocked: null,

        init() {
            this.load();
            this.onVis = () => { if (document.visibilityState === 'visible') { this.load(); this.start(); } else this.stop(); };
            document.addEventListener('visibilitychange', this.onVis);
            this.start();
        },
        destroy() { this.stop(); document.removeEventListener('visibilitychange', this.onVis); },
        start() { this.stop(); this.timer = setInterval(() => this.load(), 30000); },   // hits refresh
        stop() { clearInterval(this.timer); },

        // Filters with their domains and 7-day hits, in one request. Hits that went
        // up since the last load tick (and their filter's dot blips).
        async load() {
            let fs;
            try { fs = await api.get('/api/filters/?domains=1'); } catch (e) { return; }
            const before = {};
            this.filters.forEach(f => (f.domains || []).forEach(d => { before[d.id] = d.hits; }));
            const ticked = {}, active = {};
            (fs || []).forEach(f => (f.domains || []).forEach(d => {
                if (this.loaded && before[d.id] !== undefined && d.hits > before[d.id]) { ticked[d.id] = true; active[f.id] = true; }
            }));
            this.filters = fs || [];
            this.loaded = true;
            if (Object.keys(ticked).length) {
                this.ticked = ticked; this.active = active;
                setTimeout(() => { this.ticked = {}; this.active = {}; }, 700);
            }
        },

        get q() { return this.query.trim().toLowerCase(); },
        // Searching answers "is this allowed?", so only filter names and domains count.
        get groups() {
            const q = this.q;
            return GROUPS.map(g => ({
                key: g.key, title: g.title, sub: g.sub,
                items: this.filters.filter(f => (f.group || '') === g.key).map(f => {
                    const nameHit = !q || f.name.toLowerCase().includes(q);
                    const doms = f.domains || [];
                    const domHits = q ? doms.filter(d => d.domain.includes(q)) : doms;
                    return { f, show: nameHit || domHits.length > 0, domains: nameHit ? doms : domHits, filtered: !nameHit };
                }).filter(x => x.show),
            })).filter(g => g.items.length);
        },
        get noMatch() { return !!this.q && this.loaded && this.groups.length === 0; },
        get noMatchText() {
            return this.blocked && this.blocked.q === this.q
                ? this.query.trim() + ' is always blocked. No filter can allow it.'
                : 'Nothing matches “' + this.query.trim() + '”, so Filtered devices can\'t reach it.';
        },
        // Whether an unmatched search is a domain nothing can ever allow.
        async checkQuery() {
            const q = this.q;
            this.blocked = null;
            if (!q.includes('.')) return;
            try {
                const r = await api.get('/api/filters/check?domain=' + encodeURIComponent(q));
                if (r && !r.allowable && /always blocked/.test(r.reason || '') && this.q === q) this.blocked = { q };
            } catch (e) { /* not worth a message */ }
        },

        fmt(n) { return Number(n).toLocaleString('en-US'); },
        isOpen(x) { return !!this.open[x.f.id] || (!!this.q && x.filtered); },
        toggleOpen(x) { this.open = Object.assign({}, this.open, { [x.f.id]: !this.isOpen(x) }); this.confirmDel = null; },
        rowClass(x, i, n) {
            return [x.f.enabled ? 'on' : '', this.isOpen(x) ? 'open' : '', i === 0 ? 'first' : '', i === n - 1 ? 'last' : '',
                this.active[x.f.id] ? 'active' : '', this.freshFilter === x.f.id ? 'fresh' : ''].join(' ');
        },
        summary(f) {
            const doms = f.domains || [], ports = f.ports || [], parts = [];
            const hits = doms.reduce((a, d) => a + (d.hits || 0), 0);
            if (doms.length) parts.push(doms.length + (doms.length === 1 ? ' domain' : ' domains'));
            if (ports.length) parts.push(ports.length + (ports.length === 1 ? ' port' : ' ports'));
            if (doms.length) parts.push(hits ? this.fmt(hits) + ' hits this week' : 'no hits this week');
            if (!doms.length && !ports.length) parts.push('empty');
            return parts.join(' · ');
        },
        draft(f) {
            if (!this.drafts[f.id]) this.drafts[f.id] = { domain: '', note: '' };
            return this.drafts[f.id];
        },
        setStatus(f, text, err) { this.status = Object.assign({}, this.status, { [f.id]: text ? { text, err: !!err } : null }); },
        clearStatus(f) { if (this.status[f.id]) this.setStatus(f, null); },

        async putEnabled(f, on) { await api.put('/api/filters/' + f.id + '/enabled', { enabled: on }); },
        async toggleFilter(f, ev) {
            const on = !f.enabled;
            f.enabled = on;
            try { await this.putEnabled(f, on); } catch (e) { f.enabled = !on; ev.target.checked = !on; this.load(); return; }
            const n = (f.domains || []).length;
            const what = n ? n + (n === 1 ? ' domain' : ' domains') : ((f.ports || []).length + ' ports');
            notify(on ? f.name + ' on. Filtered devices can now reach its ' + what + '.' : f.name + ' off. Its ' + what + ' no longer apply.', 'info', {
                undo: async () => { f.enabled = !on; try { await this.putEnabled(f, !on); } catch (e) { this.load(); } },
            });
        },

        // The server normalises (a pasted URL is fine) and refuses what can't be allowed,
        // in the words shown here.
        async addDomain(f) {
            const dr = this.draft(f);
            if (!dr.domain.trim()) { this.setStatus(f, 'Enter a domain like cdn.example.com.', true); return; }
            let r;
            try {
                r = await this.postDomain(f, dr.domain, dr.note);
            } catch (e) { this.setStatus(f, e.message, true); return; }
            await this.load();
            const nf = this.filters.find(x => x.id === f.id) || f;
            const added = (nf.domains || []).find(d => d.id === r.id);
            const name = added ? added.domain : dr.domain.trim();
            this.fresh = r.id;
            setTimeout(() => { if (this.fresh === r.id) this.fresh = null; }, 1400);
            this.drafts[f.id] = { domain: '', note: '' };
            this.setStatus(f, nf.enabled ? 'Added ' + name + '. Filtered devices can reach it now.' : 'Added ' + name + '. It applies once ' + f.name + ' is on.');
        },
        // POST without the global error toast: the reason belongs next to the field.
        async postDomain(f, domain, note) {
            const res = await fetch('/api/filters/' + f.id + '/domains', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
                body: JSON.stringify({ domain, description: (note || '').trim() }),
            });
            if (res.status === 401) { window.location = '/login'; throw new Error('Signed out.'); }
            let data = null;
            try { data = await res.json(); } catch (e) { /* empty */ }
            if (!res.ok) throw new Error((data && data.error) || 'Couldn\'t add it. Try again.');
            return data;
        },
        async removeDomain(f, d) {
            try { await api.delete('/api/filters/domains/' + d.id); } catch (e) { return; }
            f.domains = (f.domains || []).filter(x => x.id !== d.id);
            notify('Removed ' + d.domain + ' from ' + f.name + '.', 'info', {
                undo: async () => { try { await this.postDomain(f, d.domain, d.description); } catch (e) { notify(e.message, 'error'); } this.load(); },
            });
        },

        openNew() { this.newErr = ''; this.newOpen = true; this.$refs.dlg.showModal(); },
        async createFilter() {
            const name = this.newName.trim();
            // Same rule as the server.
            if (!NAME.test(name)) { this.newErr = name ? 'Use letters, numbers, spaces and _ - + \' / only, starting with a letter or number.' : 'Give the filter a name.'; return; }
            if (this.filters.some(f => f.name.toLowerCase() === name.toLowerCase())) { this.newErr = 'There\'s already a filter called ' + name + '.'; return; }
            let r;
            try { r = await api.post('/api/filters', { name }); } catch (e) { this.newErr = e.message; return; }
            this.$refs.dlg.close();
            this.newName = '';
            this.query = '';
            await this.load();
            this.open = Object.assign({}, this.open, { [r.id]: true });
            this.freshFilter = r.id;
            setTimeout(() => { if (this.freshFilter === r.id) this.freshFilter = null; }, 1400);
            notify('Created ' + name + '. Add domains, then turn it on.');
        },
        async deleteFilter(f) {
            this.confirmDel = null;
            try { await api.delete('/api/filters/' + f.id); } catch (e) { return; }
            this.filters = this.filters.filter(x => x.id !== f.id);
            notify(f.name + ' deleted.');
        },
    };
}
</script>
{{end}}
